name: Build Band 11 test APK

on:
  push:
    branches: [codex/band11-extended-metrics]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Give the test build its own Android package name
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          source = path.read_text()
          original = 'applicationId "nodomain.freeyourgadget.gadgetbridge.toge"'
          if source.count(original) != 1:
              raise SystemExit("Unexpected application ID")
          path.write_text(source.replace(original, 'applicationId "nodomain.freeyourgadget.gadgetbridge.toge.band11metrics"'))

          resources = Path("app/src/mainline/res/values/strings.xml")
          values = resources.read_text(encoding="utf-8")
          authority = "com.getpebble.android.provider.toge"
          if values.count(authority) != 1:
              raise SystemExit("Unexpected content provider authority")
          values = values.replace(authority, authority + ".band11metrics")
          values = values.replace('name="app_name">健康数据<', 'name="app_name">健康数据试装版<')
          resources.write_text(values, encoding="utf-8")
          PY
      - name: Build and verify signed test APK
        run: |
          bash gradlew --no-daemon :app:assembleMainlineDebug
          mkdir -p install
          cp app/build/outputs/apk/mainline/debug/app-mainline-debug.apk install/band11-health-sync-test.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify install/band11-health-sync-test.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging install/band11-health-sync-test.apk > install/badging.txt
          grep -F "package: name='nodomain.freeyourgadget.gadgetbridge.toge.band11metrics'" install/badging.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump --values resources install/band11-health-sync-test.apk > install/resources.txt
          grep -F "com.getpebble.android.provider.toge.band11metrics" install/resources.txt
      - uses: actions/upload-artifact@v4
        with:
          name: band11-health-sync-test
          path: install/band11-health-sync-test.apk
          if-no-files-found: error
